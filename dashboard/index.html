<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An auditable ledger of AI-authored engineering activity." />
    <meta name="theme-color" content="#0f1017" />
    <title>Flagger</title>
    <script>
      // Dark-first: CSS base tokens are dark; only "light" needs the attribute.
      (function () {
        var theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark'
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'light' ? '#f3f4f8' : '#0f1017')
        if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
